name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Domain Constraints Linter
        run: npm run lint

      - name: Run Node and IndexedDB unit tests
        run: npm run test:ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Cache GenVM Direct VM SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-universal-v0.3.0-rc7-direct-cache

      - name: Download and prepare GenVM runner bundle if uncached
        run: |
          mkdir -p ~/.cache/gltest-direct
          if [ ! -f ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz ]; then
            echo "Fetching genvm-runners-all.tar.xz from v0.3.0-rc7 release..."
            curl -sSL -o ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz
          fi

      - name: Run Contract Direct VM tests
        run: npm run test:contract

      - name: Build Next.js application
        run: npm run build
        env:
          PUBLIC_CONTRACT_ADDRESS: "0xeAaF5090d59d5fBf1D32a07A30D866E3469CF826"
          PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          PUBLIC_GENLAYER_CHAIN_ID: "61999"
